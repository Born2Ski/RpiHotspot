# Same as /etc/hostapd.conf of the GX devices. hostapd-run appends ssid,
# wpa_passphrase, hw_mode and channel and writes the result to /run/hostapd.conf
interface=ap0

logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

max_num_sta=255
auth_algs=1

wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_ptk_rekey=3600
