# DHCP and DNS for the clients of the access point, same as /etc/dnsmasq.ap.conf
# of the GX devices. The stock dnsmasq only listens on lo, so they don't clash.

# Never forward plain names (with a dot or domain part)
domain-needed
# Never forward addresses in the non-routed address spaces.
bogus-priv
# Only answer locally, the access point doesn't provide internet access
no-resolv

address=/venus.local/172.24.24.1

listen-address=172.24.24.1
bind-interfaces

dhcp-range=172.24.24.10,172.24.24.200,2h
dhcp-leasefile=/run/dnsmasq.leases
